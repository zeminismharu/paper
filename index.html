<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름헤럴드 지면보기</title>
<meta name="description" content="구름헤럴드 지면보기 — 날짜별로 신문 지면을 넘겨 봅니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@900&family=Hahmlet:wght@700;900&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="paper.css">
</head>
<body>

<div class="desk">

  <div class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="deck" id="deck"><!-- 종이는 자바스크립트가 넣습니다 --></div>
      <div class="grab left"  id="grabL" aria-label="앞 면으로"></div>
      <div class="grab right" id="grabR" aria-label="다음 면으로"></div>
    </div>
  </div>

  <div class="bar">
    <div class="dates">
      <button class="nav" id="prevDate" title="이전 발행일">◀</button>
      <select id="dateSel" aria-label="발행일 선택"></select>
      <button class="nav" id="nextDate" title="다음 발행일">▶</button>
    </div>

    <div class="pagerdots" id="pager"></div>

    <button class="btn" id="btnPrev">◀ 앞</button>
    <button class="btn" id="btnNext">다음 ▶</button>
    <button class="btn" id="btnMode">한 면씩</button>
    <button class="btn" id="btnPdf">PDF 내려받기</button>
    <a class="btn btn--ghost" href="admin.html">편집</a>

    <div class="hint" id="hint">종이의 오른쪽 끝을 잡아 끌면 넘어갑니다 · 기사를 누르면 크게 읽힙니다 · ← → 키</div>
  </div>

</div>

<!-- 인쇄(PDF)용 지면. 평소에는 비어 있고, 단추를 눌렀을 때만 채웁니다. -->
<div class="printout" id="printout" aria-hidden="true"></div>

<!-- 기사 읽기 -->
<div class="reader" id="reader" hidden>
  <div class="reader__box" id="readerBox"></div>
</div>

<script src="seed.js"></script>
<script src="paper.js"></script>
<script>
(function () {
  "use strict";

  var W = 1000, H = 1390;            // 지면 한 장의 크기
  var stage = document.getElementById("stage");
  var viewport = document.getElementById("viewport");
  var deck  = document.getElementById("deck");
  var grabL = document.getElementById("grabL");
  var grabR = document.getElementById("grabR");
  var printout = document.getElementById("printout");
  var hint = document.getElementById("hint");
  var dateSel = document.getElementById("dateSel");
  var pager = document.getElementById("pager");
  var reader = document.getElementById("reader");
  var readerBox = document.getElementById("readerBox");

  var data = null, issue = null;
  var pages = [];        // 면 목록 (A1, A2 …)
  var sheets = [];       // 종이 DOM — 한 장이 앞뒤 두 면
  var N = 0;             // 종이 수
  var turned = 0;        // 넘긴 종이 수 (0 ~ N)
  var p = 0;             // 한 면씩 볼 때 지금 면 번호
  var mode = "spread";   // spread(펼침) | single(한 면씩)
  var k = 1;             // 축소 배율
  var busy = false;

  var isDraft = /[?&]draft=1/.test(location.search);

  /* ──────────── 지금 상태 ──────────── */

  function sheetOf(page) { return Math.floor(page / 2); }
  function sideOf(page)  { return page % 2; }          // 0 = 앞면, 1 = 뒷면

  /* 한 면씩 볼 때, 그 면을 보려면 종이를 몇 장 넘겨야 하는가 */
  function turnedFor(page) {
    return sideOf(page) === 0 ? sheetOf(page) : sheetOf(page) + 1;
  }

  /* deck 을 좌우로 얼마나 밀지 */
  function deckTx(t, page) {
    if (mode === "spread") {
      if (t === 0) return -W / 2;       // 첫 장 — 오른쪽 면만 있으니 가운데로
      if (t === N) return  W / 2;       // 마지막 — 왼쪽 면만 있으니 가운데로
      return 0;
    }
    return sideOf(page) === 1 ? 0 : -W; // 뒷면은 왼쪽 절반, 앞면은 오른쪽 절반
  }

  function applyDeck(tx) {
    deck.style.transform = "scale(" + k + ") translateX(" + tx + "px)";
  }

  function applySheets(t, dragIdx, dragDeg, dragZ) {
    sheets.forEach(function (s, i) {
      var deg = (i < t) ? -180 : 0;
      var z   = (i < t) ? i : (N - i);
      if (i === dragIdx) { deg = dragDeg; z = dragZ; }
      s.style.transform = "rotateY(" + deg + "deg)";
      s.style.zIndex = z;
      var sh = s.querySelector(".shade");
      if (sh) sh.style.opacity = Math.min(0.5, Math.abs(deg) / 180 * 0.5);
    });
  }

  function apply() {
    applySheets(turned);
    applyDeck(deckTx(turned, p));
  }

  /* ──────────── 크기 맞추기 ──────────── */

  function fit() {
    var availW = stage.clientWidth - 28;
    var availH = stage.clientHeight - 28;
    var wide = mode === "spread" ? W * 2 : W;
    k = Math.min(availW / wide, availH / H);
    k = Math.max(0.12, Math.min(k, 1.1));
    viewport.style.width  = (wide * k) + "px";
    viewport.style.height = (H * k) + "px";
    apply();
  }

  /* ──────────── 지면 만들기 ──────────── */

  function buildIssue(iss) {
    issue = iss;
    pages = iss.pages || [];
    deck.innerHTML = "";
    sheets = [];
    N = Math.ceil(pages.length / 2);
    turned = 0;
    p = 0;

    for (var i = 0; i < N; i++) {
      var front = pages[i * 2];
      var back  = pages[i * 2 + 1];
      var sheet = document.createElement("div");
      sheet.className = "sheet";
      sheet.dataset.i = i;
      sheet.innerHTML =
        '<div class="face front" data-page="' + (i * 2) + '">' +
          (front ? Paper.renderPage(iss, front) : "") +
          '<div class="shade"></div>' +
        "</div>" +
        '<div class="face back" data-page="' + (i * 2 + 1) + '">' +
          (back ? Paper.renderPage(iss, back) : "") +
        "</div>";
      deck.appendChild(sheet);
      sheets.push(sheet);
    }

    buildPager();
    fit();
    updateNav();
  }

  function buildPager() {
    pager.innerHTML = "";
    pages.forEach(function (pg, i) {
      var b = document.createElement("button");
      b.textContent = pg.label || (i + 1);
      b.addEventListener("click", function () { goToPage(i); });
      pager.appendChild(b);
    });
  }

  /* 지금 보이는 면들 */
  function visiblePages() {
    if (mode === "single") return [p];
    var out = [];
    if (turned > 0) out.push(turned * 2 - 1);
    if (turned < N) out.push(turned * 2);
    return out.filter(function (i) { return i < pages.length; });
  }

  function updateNav() {
    var vis = visiblePages();
    Array.prototype.forEach.call(pager.children, function (b, i) {
      b.setAttribute("aria-current", vis.indexOf(i) >= 0 ? "true" : "false");
    });
    var atStart = mode === "single" ? p === 0 : turned === 0;
    var atEnd   = mode === "single" ? p >= pages.length - 1 : turned >= N;
    document.getElementById("btnPrev").disabled = atStart;
    document.getElementById("btnNext").disabled = atEnd;
    grabL.classList.toggle("off", atStart);
    grabR.classList.toggle("off", atEnd);
    document.getElementById("btnMode").textContent =
      mode === "spread" ? "한 면씩" : "펼쳐 보기";
  }

  /* ──────────── 한 걸음이 무엇인지 ────────────
     앞으로 한 걸음이 '종이를 넘기는 것(flip)'인지
     '옆 장으로 옮기는 것(slide)'인지 알려 줍니다. */
  function stepInfo(dir) {          // dir: 1 앞으로, -1 뒤로
    if (mode === "spread") {
      var t2 = turned + dir;
      if (t2 < 0 || t2 > N) return null;
      return { kind: "flip", sheet: dir === 1 ? turned : turned - 1,
               turned: t2, page: p, tx0: deckTx(turned, p), tx1: deckTx(t2, p) };
    }
    var p2 = p + dir;
    if (p2 < 0 || p2 >= pages.length) return null;
    var t2s = turnedFor(p2);
    return {
      kind: t2s === turned ? "slide" : "flip",
      sheet: dir === 1 ? turned : turned - 1,
      turned: t2s, page: p2,
      tx0: deckTx(turned, p), tx1: deckTx(t2s, p2)
    };
  }

  function commit(step) {
    turned = step.turned;
    p = step.page;
    apply();
    updateNav();
  }

  function animate(step) {
    if (busy || !step) return;
    busy = true;
    var s = step.kind === "flip" ? sheets[step.sheet] : null;
    if (s) s.classList.add("is-animating");
    deck.classList.add("is-animating");

    if (s) applySheets(turned, step.sheet, (step.turned > turned) ? -180 : 0, 100);
    else applySheets(turned);
    applyDeck(step.tx1);

    window.setTimeout(function () {
      if (s) s.classList.remove("is-animating");
      deck.classList.remove("is-animating");
      commit(step);
      busy = false;
    }, 840);
  }

  function next() { animate(stepInfo(1)); }
  function prev() { animate(stepInfo(-1)); }

  function goToPage(target) {
    if (busy || target < 0 || target >= pages.length) return;
    if (mode === "single") {
      if (target === p) return;
      p = target; turned = turnedFor(p);
    } else {
      var t = Math.min(N, sheetOf(target) + (sideOf(target) === 1 ? 1 : 0));
      if (t === turned) { updateNav(); return; }
      turned = t;
    }
    apply();
    updateNav();
  }

  /* ──────────── 끌어서 넘기기 ──────────── */
  function makeDraggable(handle, dir) {
    var active = null, startX = 0, moved = 0, step = null;

    handle.addEventListener("pointerdown", function (e) {
      if (busy) return;
      step = stepInfo(dir);
      if (!step) return;
      active = e.pointerId; startX = e.clientX; moved = 0;
      // 끄는 동안에만 그래픽 메모리를 씁니다 (평소에 켜 두면 휴대전화가 버겁습니다)
      if (step.kind === "flip" && sheets[step.sheet]) sheets[step.sheet].classList.add("is-dragging");
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener("pointermove", function (e) {
      if (active !== e.pointerId || !step) return;
      var w = viewport.clientWidth || 1;
      var dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      var t = Math.max(0, Math.min(1, (dir === 1 ? -dx : dx) / w));
      if (step.kind === "flip") {
        var forward = step.turned > turned;
        var deg = forward ? -180 * t : -180 * (1 - t);
        applySheets(turned, step.sheet, deg, 100);
      }
      applyDeck(step.tx0 + (step.tx1 - step.tx0) * t);
      e.preventDefault();
    });

    function finish(e) {
      if (active !== e.pointerId) return;
      active = null;
      var st = step; step = null;
      if (st && st.kind === "flip" && sheets[st.sheet]) sheets[st.sheet].classList.remove("is-dragging");
      if (!st) return;

      if (moved < 6) { animate(st); return; }   // 그냥 눌렀다 → 한 걸음

      var w = viewport.clientWidth || 1;
      var dx = e.clientX - startX;
      var t = Math.max(0, Math.min(1, (dir === 1 ? -dx : dx) / w));
      var passed = t > 0.22;

      busy = true;
      var s = st.kind === "flip" ? sheets[st.sheet] : null;
      if (s) s.classList.add("is-animating");
      deck.classList.add("is-animating");
      if (s) {
        var forward = st.turned > turned;
        var settle = passed ? (forward ? -180 : 0) : (forward ? 0 : -180);
        applySheets(turned, st.sheet, settle, 100);
      }
      applyDeck(passed ? st.tx1 : st.tx0);

      window.setTimeout(function () {
        if (s) s.classList.remove("is-animating");
        deck.classList.remove("is-animating");
        if (passed) commit(st); else apply();
        updateNav();
        busy = false;
      }, 520);
    }
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
  }

  /* ──────────── 기사 읽기 ──────────── */
  function openReader(pageIdx, blockIdx) {
    var page = pages[pageIdx];
    if (!page) return;
    var b = (page.blocks || [])[blockIdx];
    if (!b) return;
    readerBox.innerHTML =
      '<button class="reader__close" id="rClose" aria-label="닫기">×</button>' +
      (b.kicker ? '<div class="reader__kicker">' + Paper.esc(b.kicker) + "</div>" : "") +
      '<h1 class="reader__title">' + Paper.esc(b.head || b.title) + "</h1>" +
      '<div class="reader__meta">' +
        "<span>" + Paper.esc(Paper.fmtDate(issue.date)) + "</span>" +
        (b.byline ? "<span>" + Paper.esc(b.byline) + "</span>" : "") +
        "<span>" + Paper.esc(page.label || "") + "면</span>" +
      "</div>" +
      (b.image ? '<img src="' + Paper.esc(b.image) + '" alt="">' : "") +
      '<div class="reader__body' + (b.verse ? " reader__body--verse" : "") + '">' +
        Paper.paras(b.body).map(function (t) { return "<p>" + Paper.esc(t) + "</p>"; }).join("") +
      "</div>" +
      (b.link
        ? '<p class="reader__link"><a href="' + Paper.esc(b.link) +
          '" target="_blank" rel="noopener">구름헤럴드에서 기사 전문 보기 ↗</a></p>' +
          '<p class="reader__note">지면에 실린 글은 칸에 맞춰 줄인 요약입니다.</p>'
        : "");
    reader.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("rClose").addEventListener("click", closeReader);
  }
  function closeReader() {
    reader.hidden = true;
    document.body.style.overflow = "";
  }
  reader.addEventListener("click", function (e) { if (e.target === reader) closeReader(); });

  deck.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-read]") : null;
    if (!el) return;
    var face = el.closest(".face");
    if (!face) return;
    var pageIdx = +face.dataset.page;
    if (visiblePages().indexOf(pageIdx) < 0) return;   // 지금 보이는 면만
    openReader(pageIdx, +el.dataset.read);
  });

  /* ──────────── 날짜 ──────────── */
  /* ── PDF 내려받기 ────────────────────────────────────
     지면을 그림으로 굽지 않고 브라우저 인쇄 기능에 넘깁니다.
     글자가 글자로 남아 확대해도 또렷하고 파일도 가볍습니다.
     넘기는 종이(deck)는 3차원으로 뒤집혀 있어서 그대로는
     인쇄되지 않으므로, 여섯 면을 평평하게 다시 그려 줍니다. */
  function buildPrintout() {
    if (!issue) return;
    printout.innerHTML = issue.pages.map(function (pg) {
      return '<div class="printsheet"><div class="pagebox">' +
             Paper.renderPage(issue, pg) +
             "</div></div>";
    }).join("");
  }

  document.getElementById("btnPdf").addEventListener("click", function () {
    buildPrintout();
    hint.textContent = "인쇄 창에서 ‘대상’을 ‘PDF로 저장’으로 고르시면 지면이 그대로 저장됩니다.";
    // 그림이 다 뜬 뒤에 인쇄 창을 엽니다
    var imgs = Array.prototype.slice.call(printout.querySelectorAll("img"));
    var wait = imgs.filter(function (im) { return !im.complete; })
                   .map(function (im) {
                     return new Promise(function (done) {
                       im.addEventListener("load", done, { once: true });
                       im.addEventListener("error", done, { once: true });
                     });
                   });
    Promise.all(wait).then(function () {
      window.setTimeout(function () { window.print(); }, 60);
    });
  });

  // 인쇄가 끝나면 그릇을 비웁니다 (안 비우면 화면이 무거워집니다)
  window.addEventListener("afterprint", function () { printout.innerHTML = ""; });

  function buildDates() {
    dateSel.innerHTML = "";
    data.issues.forEach(function (iss, i) {
      var o = document.createElement("option");
      o.value = i;
      o.textContent = Paper.fmtDate(iss.date) + "   (" + (iss.pages || []).length + "면)";
      dateSel.appendChild(o);
    });
    dateSel.value = 0;
    syncDateNav();
  }
  function syncDateNav() {
    var i = +dateSel.value;
    document.getElementById("prevDate").disabled = i >= data.issues.length - 1;
    document.getElementById("nextDate").disabled = i <= 0;
  }
  dateSel.addEventListener("change", function () {
    buildIssue(data.issues[+dateSel.value]);
    syncDateNav();
  });
  document.getElementById("prevDate").addEventListener("click", function () {
    var i = +dateSel.value;
    if (i < data.issues.length - 1) { dateSel.value = i + 1; dateSel.dispatchEvent(new Event("change")); }
  });
  document.getElementById("nextDate").addEventListener("click", function () {
    var i = +dateSel.value;
    if (i > 0) { dateSel.value = i - 1; dateSel.dispatchEvent(new Event("change")); }
  });

  /* ──────────── 연결 ──────────── */
  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPrev").addEventListener("click", prev);
  document.getElementById("btnMode").addEventListener("click", function () {
    mode = mode === "spread" ? "single" : "spread";
    if (mode === "single") p = Math.min(pages.length - 1, turned === 0 ? 0 : turned * 2 - 1);
    else turned = turnedFor(p);
    fit(); updateNav();
  });
  makeDraggable(grabR, 1);
  makeDraggable(grabL, -1);

  document.addEventListener("keydown", function (e) {
    if (!reader.hidden) { if (e.key === "Escape") closeReader(); return; }
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  window.addEventListener("resize", fit);

  /* ──────────── 시작 ──────────── */
  Paper.load({ draft: isDraft }).then(function (d) {
    data = d;
    if (!data || !data.issues || !data.issues.length) {
      stage.innerHTML = '<p style="font-family:var(--sans)">아직 발행된 지면이 없습니다. 편집 화면에서 지면을 만들어 주세요.</p>';
      return;
    }
    data.issues.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    // 좁은 화면에서 두 면을 나란히 놓으면 글씨가 너무 작아집니다
    if (window.innerWidth < 900) mode = "single";
    if (isDraft) {
      document.getElementById("hint").textContent =
        "※ 편집 중인 원고를 보고 있습니다 (이 브라우저에만 저장된 내용입니다)";
    }
    buildDates();
    buildIssue(data.issues[0]);
  });
})();
</script>
</body>
</html>
