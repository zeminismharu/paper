# 구름헤럴드 지면보기 배포
#
# 사장님 컴퓨터가 꺼져 있어도 GitHub 이 대신 올려 줍니다.
#
# 일부러 "단추를 눌렀을 때만" 돌게 해두었습니다.
# 파일을 고칠 때마다 자동으로 올라가면, 아직 안 끝난 원고가 손님에게 보입니다.
# 신문은 더더욱 그렇습니다. 발행은 사장님이 정하는 것입니다.
#
# 쓰는 법 : 저장소 → Actions 탭 → 왼쪽에서 이 작업 선택
#           → 오른쪽 "Run workflow" 단추 (휴대폰에서도 됩니다)

name: 지면 발행

on:
  workflow_dispatch:        # 단추를 눌렀을 때만 돕니다

permissions:
  contents: read
  pages: write
  id-token: write

# 발행이 겹치면 나중 것만 남깁니다 (앞의 것은 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      # 저장소에는 손님이 볼 필요 없는 파일도 같이 들어 있습니다.
      # 그대로 올리면 README.md 나 기사 원문 파일이 인터넷 주소로 열립니다.
      # 그래서 손님에게 보여도 되는 것만 _site 로 골라 담아 올립니다.
      - name: 올릴 파일만 따로 모으기
        run: |
          mkdir -p _site
          cp index.html admin.html paper.css paper.js seed.js _site/
          mkdir -p _site/data
          cp data/paper.json _site/data/
          # 광고 배경 등 지면이 쓰는 그림
          [ -d images ] && cp -r images _site/ || true
          # 밑줄로 시작하는 폴더를 GitHub 이 건드리지 않게 합니다
          touch _site/.nojekyll
          echo "── 올라갈 파일 ──"
          find _site -mindepth 1 | sort

      # ⚠️ 딱 한 번, 저장소 주인이 미리 해두셔야 하는 설정이 있습니다.
      #    저장소 → Settings → Pages → Build and deployment
      #    → Source 를 "GitHub Actions" 로 바꾸고 저장
      #    (이 작업은 Pages 를 대신 켜 줄 권한이 없습니다. 안 켜져 있으면
      #     여기서 "Get Pages site failed. Error: Not Found" 로 멈춥니다.)
      - name: 지면 설정 확인
        uses: actions/configure-pages@v5

      - name: 꾸러미 만들기
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages 에 올리기
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 주소 알려 주기
        run: echo "지면보기 → ${{ steps.deploy.outputs.page_url }}"
